<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZERO STRESS Performance & Leaderboard Manager [Advanced Edition]</title>
    <!-- Include Tesseract.js for Image Text Recognition -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <!-- Include Cropper.js for Image Cropping -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <!-- Include html2canvas for Image/Scorecard Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Include Google Material Symbols Font -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" />
    
    <!-- Firebase App (v10 Modular SDK) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, onSnapshot, addDoc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAiTMIxl3K1R30BlbcqqdwMKgi5oZF1gYQ",
            authDomain: "zerostress-manager.firebaseapp.com",
            projectId: "zerostress-manager",
            storageBucket: "zerostress-manager.firebasestorage.app",
            messagingSenderId: "467368325437",
            appId: "1:467368325437:web:450105da2880917ae6d554",
            measurementId: "G-PLX9J3K7SW"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.firebaseModules = { collection, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, onSnapshot, addDoc, query, orderBy, limit };
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #131c31;
            --text-color: #f1f5f9;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --border-color: #1e293b;
            --gold: #f59e0b;
            --silver: #94a3b8;
            --bronze: #b45309;
            --glow-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
        }

        body.light-theme {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --accent-color: #0284c7;
            --accent-hover: #0369a1;
            --border-color: #e2e8f0;
            --silver: #64748b;
            --glow-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background-attachment: fixed;
            transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1), color 0.4s ease;
        }

        .permission-banner {
            background: var(--card-bg);
            border: 1px solid var(--accent-color);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--glow-shadow);
        }

        .permission-banner button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .permission-banner button:hover {
            background: var(--accent-hover);
        }

        #appLoadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-size: 1.2rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--glow-shadow);
        }

        h2 { margin-top: 0; color: var(--accent-color); }
        .action-btn {
            padding: 10px 15px;
            background: var(--accent-color);
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            margin-right: 5px;
        }
        .action-btn:hover { background: var(--accent-hover); }
        .text-input {
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div id="appLoadingScreen">
        <p>Loading ZERO STRESS Manager...</p>
    </div>

    <div class="container">
        <!-- Permissions Request Bar -->
        <div id="permissionCard" class="permission-banner">
            <div>
                <strong>Enable App Permissions:</strong> Allow notifications and local storage access for live leaderboards.
            </div>
            <button onclick="requestAppPermissions()">Grant Permissions</button>
        </div>

        <div class="card">
            <h2>🏆 Live Leaderboards & Announcements</h2>
            <div id="liveUpdatesFeed">
                <p>Connecting to live database...</p>
            </div>
        </div>

        <div class="card">
            <h2>📝 Actions & Event Triggers</h2>
            
            <!-- Register New Player -->
            <div style="margin-bottom: 15px;">
                <input type="text" id="playerNameInput" placeholder="Enter Player Name" class="text-input" style="width: 65%; display: inline-block;">
                <button onclick="registerNewPlayerAndNotify()" class="action-btn" style="display: inline-block;">Register & Notify</button>
            </div>

            <hr style="border-color: var(--border-color); margin: 15px 0;">

            <!-- Publish Custom Announcement / Reminder -->
            <div>
                <input type="text" id="announcementInput" placeholder="Enter announcement or reminder message..." class="text-input">
                <button onclick="publishAnnouncement()" class="action-btn" style="background: #6366f1;">Publish Announcement</button>
            </div>

            <!-- Pre-built Event Trigger Buttons -->
            <div style="margin-top: 15px;">
                <button onclick="saveDailyScoresAndNotify()" class="action-btn" style="background: #10b981;">Save Daily Scores</button>
                <button onclick="updateWeeklyStandings()" class="action-btn" style="background: #f59e0b;">Reset / Update Weekly Standings</button>
            </div>
        </div>
    </div>

    <script>
        // 1. Handle App Permissions (Notifications & Local Storage Check)
        function requestAppPermissions() {
            try {
                localStorage.setItem("zero_stress_test", "active");
                localStorage.removeItem("zero_stress_test");
                console.log("Local Storage permission/availability: OK");
            } catch (e) {
                alert("Storage permission error! Please enable storage in your device/app settings.");
            }

            if (!("Notification" in window)) {
                alert("This device/browser does not support status bar notifications.");
                return;
            }

            Notification.requestPermission().then((permission) => {
                if (permission === "granted") {
                    alert("Notifications enabled successfully!");
                    document.getElementById("permissionCard").style.display = "none";
                } else {
                    alert("Notification permission denied. You won't receive live alerts.");
                }
            });
        }

        // Trigger status bar notifications popup on mobile devices
        function showStatusBarAlert(title, message) {
            if ("Notification" in window && Notification.permission === "granted") {
                try {
                    if (navigator.serviceWorker && navigator.serviceWorker.ready) {
                        navigator.serviceWorker.ready.then(registration => {
                            registration.showNotification(title, {
                                body: message,
                                icon: "https://cdn-icons-png.flaticon.com/512/3112/3112946.png",
                                badge: "https://cdn-icons-png.flaticon.com/512/3112/3112946.png",
                                vibrate: [200, 100, 200]
                            });
                        });
                    } else {
                        new Notification(title, { 
                            body: message,
                            icon: "https://cdn-icons-png.flaticon.com/512/3112/3112946.png"
                        });
                    }
                } catch (e) {
                    console.error("Error triggering status bar alert:", e);
                }
            }
        }

        // 2. Initialize Firebase Listeners upon loading
        window.addEventListener('firebase-ready', () => {
            document.getElementById('appLoadingScreen').style.display = 'none';
            initRealtimeListeners();
        });

        function initRealtimeListeners() {
            const { collection, onSnapshot, query, orderBy } = window.firebaseModules;
            const db = window.db;

            const q = query(collection(db, "notifications_feed"), orderBy("timestamp", "desc"));
            
            onSnapshot(q, (snapshot) => {
                let feedHTML = "";
                let isFirstChange = true;

                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added" && !isFirstChange) {
                        const data = change.doc.data();
                        showStatusBarAlert(data.title || "Zero Stress Update", data.message || "New activity recorded.");
                    }
                });

                snapshot.forEach((doc) => {
                    let data = doc.data();
                    feedHTML += `<div style="padding: 10px 0; border-bottom: 1px solid var(--border-color);">
                        <strong>${data.title}</strong>: ${data.message} <br><small style="color: var(--silver);">${data.timestamp?.toDate ? new Date(data.timestamp.toDate()).toLocaleTimeString() : 'Just now'}</small>
                    </div>`;
                });
                
                document.getElementById("liveUpdatesFeed").innerHTML = feedHTML || "<p>No recent updates found.</p>";
            }, (error) => {
                console.error("Firestore snapshot error: ", error);
                document.getElementById("liveUpdatesFeed").innerHTML = "<p>Connected, waiting for feed data...</p>";
            });
        }

        // 3. Connected App Event Triggers

        // A. Register New Player
        async function registerNewPlayerAndNotify() {
            const playerName = document.getElementById("playerNameInput").value.trim();
            if (!playerName) {
                alert("Please enter a player name!");
                return;
            }

            const { collection, addDoc } = window.firebaseModules;
            const db = window.db;

            try {
                const title = "New Player Registered!";
                const message = `Welcome ${playerName} to the ZERO STRESS League! Check out the updated leaderboard.`;

                await addDoc(collection(db, "notifications_feed"), { title, message, timestamp: new Date() });
                showStatusBarAlert(title, message);
                
                document.getElementById("playerNameInput").value = "";
                alert("Player registered and broadcasted successfully!");
            } catch (e) {
                console.error("Error adding document: ", e);
                alert("Failed to register player. Check network connection.");
            }
        }

        // B. Save Daily Scores & Notify
        async function saveDailyScoresAndNotify() {
            const { collection, addDoc } = window.firebaseModules;
            const db = window.db;

            try {
                const title = "🏆 Daily Leaderboard Updated";
                const message = "Today's scores have been finalized. Check your new rank!";
                
                await addDoc(collection(db, "notifications_feed"), { title, message, timestamp: new Date() });
                showStatusBarAlert(title, message);
                alert("Daily scores saved and broadcasted to device status bars!");
            } catch (e) {
                console.error("Error saving daily scores: ", e);
                alert("Failed to save daily scores.");
            }
        }

        // C. Update Weekly Standings & Notify
        async function updateWeeklyStandings() {
            const { collection, addDoc } = window.firebaseModules;
            const db = window.db;

            try {
                const title = "🌟 Weekly Standings Live!";
                const message = "The weekly leaderboard has been updated. See who took the crown!";
                
                await addDoc(collection(db, "notifications_feed"), { title, message, timestamp: new Date() });
                showStatusBarAlert(title, message);
                alert("Weekly standings updated and broadcasted!");
            } catch (e) {
                console.error("Error updating weekly standings: ", e);
                alert("Failed to update weekly standings.");
            }
        }

        // D. Publish Announcement / Reminder & Notify
        async function publishAnnouncement() {
            const announcementText = document.getElementById("announcementInput").value.trim();
            if (!announcementText) {
                alert("Please enter an announcement or reminder message!");
                return;
            }

            const { collection, addDoc } = window.firebaseModules;
            const db = window.db;

            try {
                const title = "📢 Announcement & Reminder";
                const message = announcementText;
                
                await addDoc(collection(db, "notifications_feed"), { title, message, timestamp: new Date() });
                showStatusBarAlert(title, message);
                
                document.getElementById("announcementInput").value = "";
                alert("Announcement published and sent to device status bars!");
            } catch (e) {
                console.error("Error publishing announcement: ", e);
                alert("Failed to publish announcement.");
            }
        }
    </script>
</body>
</html>
