plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.zerostress.manager'
    compileSdk 34

    defaultConfig {
        applicationId "com.zerostress.manager"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    signingConfigs {
        release {
            storeFile file("../zerostress.keystore")
            storePassword "zerostress123"
            keyAlias "zerostress"
            keyPassword "zerostress123"
        }
    }

    buildTypes {
        debug {
            applicationVariants.configureEach { variant ->
                variant.outputs.configureEach {
                    outputFileName = "ZeroStress-v${variant.versionName}-debug.apk"
                }
            }
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            applicationVariants.configureEach { variant ->
                variant.outputs.configureEach {
                    outputFileName = "ZeroStress-v${variant.versionName}.apk"
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Gson for JSON serialization
    implementation 'com.google.code.gson:gson:2.10.1'

    // Firebase BOM
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-messaging'

    // Jitsi Meet SDK - FREE voice/video chat, no API key needed!
    implementation 'org.jitsi:jitsi-meet-sdk:8.3.2'

    // Firebase Auth (Jitsi needs it for user identity)
    implementation 'com.google.firebase:firebase-auth'
}
